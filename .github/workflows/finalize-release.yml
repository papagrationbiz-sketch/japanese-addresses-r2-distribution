name: Finalize address data release

on:
  workflow_dispatch:
    inputs:
      expected_current:
        description: Current version to finalize (for example v2026-10)
        required: true
      confirmation:
        description: Type DELETE_OLDER_THAN_PREVIOUS after downstream acceptance checks
        required: true

permissions:
  contents: read

concurrency:
  group: r2-address-data-publish
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: r2-production
    env:
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate finalize inputs
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          if ! [[ "$R2_BUCKET" =~ ^[a-z0-9]([a-z0-9-]{1,61}[a-z0-9])?$ ]]; then exit 1; fi
          if ! [[ "$R2_ENDPOINT" =~ ^https://[A-Za-z0-9.-]+$ ]]; then exit 1; fi
          if ! [[ "$PUBLIC_BASE_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?$ ]]; then exit 1; fi
          if ! [[ "$EXPECTED_CURRENT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then exit 1; fi
          if [ "$CONFIRMATION" != 'DELETE_OLDER_THAN_PREVIOUS' ]; then echo 'confirmation must be DELETE_OLDER_THAN_PREVIOUS' >&2; exit 1; fi
      - name: Read and validate manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          aws s3 cp "s3://$R2_BUCKET/manifest.json" manifest-before-finalize.json --endpoint-url "$R2_ENDPOINT" --no-progress
          npm run manifest -- validate manifest-before-finalize.json
          current="$(jq -r '.current' manifest-before-finalize.json)"
          test "$current" = "$EXPECTED_CURRENT"
      - name: Smoke test public gateway after downstream acceptance checks
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          npm run smoke -- "$PUBLIC_BASE_URL" "$EXPECTED_CURRENT"
      - name: Prune manifest and remove only registered retired prefixes
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          aws s3 cp "s3://$R2_BUCKET/manifest.json" manifest-before-prune-check.json --endpoint-url "$R2_ENDPOINT" --no-progress
          if ! cmp --silent manifest-before-finalize.json manifest-before-prune-check.json; then
            echo 'concurrent manifest update; refusing prune and delete' >&2
            exit 1
          fi
          npm run manifest -- validate manifest-before-finalize.json
          current="$(jq -r '.current' manifest-before-finalize.json)"
          test "$current" = "$EXPECTED_CURRENT"
          npm run manifest -- retired-prefixes manifest-before-finalize.json retired-prefixes.txt
          if [ ! -s retired-prefixes.txt ]; then
            echo 'No versions older than previous; nothing to delete'
            exit 0
          fi
          npm run manifest -- prune manifest-before-finalize.json
          npm run manifest -- validate manifest-before-finalize.json
          aws s3 cp manifest-before-finalize.json "s3://$R2_BUCKET/manifest.json" --endpoint-url "$R2_ENDPOINT" --content-type application/json --cache-control no-cache --no-progress
          while IFS= read -r prefix; do
            aws s3 rm "s3://$R2_BUCKET/$prefix/" --recursive --endpoint-url "$R2_ENDPOINT" --no-progress
          done < retired-prefixes.txt
