name: Build and publish address data

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Exact upstream commit SHA (40 lowercase hex characters)
        required: true
        default: 521f6130110dabcc8d6d12e89606f0515c217eed
      version:
        description: Immutable R2 version id, for example v2026-10
        required: true
      activate:
        description: Switch manifest current after upload
        required: true
        type: boolean
        default: false
      runner:
        description: >-
          Runner label. ABRの配信CDNは日本国外を403で拒否するため、生成には日本国内の
          self-hosted runnerが必要になる。GitHub-hosted runnerは日本に配置されない。
        type: string
        default: ubuntu-latest

permissions:
  contents: read

concurrency:
  group: r2-address-data-publish
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    environment: r2-production
    env:
      VERSION: ${{ inputs.version }}
      UPSTREAM_REF: ${{ inputs.upstream_ref }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate inputs
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          if ! [[ "$R2_BUCKET" =~ ^[a-z0-9]([a-z0-9-]{1,61}[a-z0-9])?$ ]]; then exit 1; fi
          if ! [[ "$R2_ENDPOINT" =~ ^https://[A-Za-z0-9.-]+$ ]]; then exit 1; fi
          if [ '${{ inputs.activate }}' = 'true' ] && [ -z "$PUBLIC_BASE_URL" ]; then echo 'PUBLIC_BASE_URL is required when activate is true' >&2; exit 1; fi
          if [ -n "$PUBLIC_BASE_URL" ] && ! [[ "$PUBLIC_BASE_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?$ ]]; then exit 1; fi
          if ! [[ "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then exit 1; fi
          if ! [[ "$UPSTREAM_REF" =~ ^[0-9a-f]{40}$ ]]; then echo 'upstream_ref must be a 40-character lowercase commit SHA' >&2; exit 1; fi
      - name: Require the runner to reach the ABR distribution CDN
        run: |
          # ABRの配信CDNは日本国外からのアクセスを403で拒否する。生成は最初の
          # ダウンロードで必ず失敗するため、数時間分のstepを走らせる前に止める。
          url='https://data.address-br.digital.go.jp/mt_town/mt_town_all.csv.zip'
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 -r 0-0 -A 'curl/8.7.1' "$url" || echo 000)"
          echo "ABR distribution CDN: HTTP $status"
          case "$status" in
            200|206) ;;
            *)
              echo "this runner cannot download ABR data (HTTP $status)" >&2
              echo 'run this workflow on a Japan-based self-hosted runner via the runner input,' >&2
              echo 'or publish from a verified local generation as described in' >&2
              echo 'docs/operations/update-workflow.md' >&2
              exit 1
              ;;
          esac
      - name: Checkout upstream without a fork
        run: |
          git clone --no-checkout https://github.com/geolonia/japanese-addresses-v2.git upstream
          git -C upstream fetch --depth=1 origin "$UPSTREAM_REF"
          git -C upstream checkout --detach FETCH_HEAD
          actual="$(git -C upstream rev-parse HEAD)"
          test "$actual" = "$UPSTREAM_REF"
          echo "UPSTREAM_COMMIT=$actual" >> "$GITHUB_ENV"
      - name: Generate all address data in an isolated container
        working-directory: upstream
        run: |
          build_tmp="$RUNNER_TEMP/japanese-addresses-v2-tmp"
          trap 'rm -rf "$build_tmp"; if [ -n "${city_files:-}" ]; then rm -f "$city_files"; fi' EXIT
          mkdir -p "$build_tmp"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --workdir /workspace/upstream \
            --mount "type=bind,src=$PWD,dst=/workspace/upstream" \
            --mount "type=bind,src=$build_tmp,dst=/work-tmp" \
            --env TMPDIR=/work-tmp \
            --env CACHE_DIR=/work-tmp/cache \
            --env NPM_CONFIG_CACHE=/work-tmp/npm-cache \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev \
            node:22-bookworm \
            bash -ceu '
              set -o pipefail
              test "$(id -u)" -ne 0
              final_out=/workspace/upstream/out/api
              rm -rf "$final_out"
              npm ci
              npm run run:01_make_prefecture_city -- "$final_out"

              copy_stage_files() {
                stage_out="$1"
                file_suffix="$2"
                pref_name="$3"
                first_file="$(find "$stage_out/ja/$pref_name" -type f -name "*-$file_suffix.txt" -print -quit)"
                if [ -z "$first_file" ]; then
                  echo "stage produced no $pref_name/*-$file_suffix.txt files" >&2
                  return 1
                fi
                find "$final_out/ja/$pref_name" -type f -name "*-$file_suffix.txt" -delete
                find "$stage_out/ja/$pref_name" -type f -name "*-$file_suffix.txt" -print0 |
                  while IFS= read -r -d "" source_file; do
                    relative_file="${source_file#"$stage_out/"}"
                    mkdir -p "$final_out/$(dirname "$relative_file")"
                    cp -- "$source_file" "$final_out/$relative_file"
                  done
              }

              copy_prefecture_json() {
                stage_out="$1"
                pref_name="$2"
                first_file="$(find "$stage_out/ja/$pref_name" -type f -name "*.json" -print -quit)"
                if [ -z "$first_file" ]; then
                  echo "stage produced no $pref_name municipality JSON files" >&2
                  return 1
                fi
                rm -rf "$final_out/ja/$pref_name"
                mkdir -p "$final_out/ja/$pref_name"
                find "$stage_out/ja/$pref_name" -type f -name "*.json" -print0 |
                  while IFS= read -r -d "" source_file; do
                    relative_file="${source_file#"$stage_out/"}"
                    mkdir -p "$final_out/$(dirname "$relative_file")"
                    cp -- "$source_file" "$final_out/$relative_file"
                  done
              }

              run_data_stage() {
                script="$1"
                file_suffix="$2"
                pref_code="$3"
                pref_name="$4"
                attempt=1
                while :; do
                  attempt_out="/work-tmp/${pref_code}-${file_suffix}-attempt-${attempt}"
                  log="/work-tmp/${pref_code}-${file_suffix}-attempt-${attempt}.log"
                  rm -rf /work-tmp/merge-data-left-join-*
                  rm -rf "$attempt_out"
                  mkdir -p "$attempt_out"
                  echo "Running $script for $pref_name (attempt $attempt/3)"
                  if npm run "$script" -- "$attempt_out" 2>&1 | tee "$log"; then
                    copy_stage_files "$attempt_out" "$file_suffix" "$pref_name"
                    rm -rf "$attempt_out" "$log"
                    return 0
                  fi
                  status="${PIPESTATUS[0]}"
                  if [ "$status" -eq 0 ]; then
                    status=1
                  fi
                  rm -rf /work-tmp/merge-data-left-join-*
                  if grep -Eiq "SQLITE_FULL|input (is )?inconsistent|inconsistent input" "$log"; then
                    echo "$script failed with a non-retryable storage/input error" >&2
                    return "$status"
                  fi
                  if ! grep -Eiq "terminated|UND_ERR_SOCKET|ECONNRESET|ETIMEDOUT|ECONNREFUSED|EPIPE|socket hang up|fetch failed|premature close|connection (reset|closed|timed out)|body.*(timeout|reset|closed)" "$log"; then
                    echo "$script failed with a non-retryable error" >&2
                    return "$status"
                  fi
                  if [ "$attempt" -ge 3 ]; then
                    echo "$script failed after $attempt transient-error attempts" >&2
                    return "$status"
                  fi
                  echo "$script failed with a transient body/network error; retrying with a fresh output directory" >&2
                  rm -rf "$attempt_out"
                  sleep "$((attempt * 10))"
                  attempt="$((attempt + 1))"
                done
              }

              for pref_spec in \
                "01:北海道" "02:青森県" "03:岩手県" "04:宮城県" "05:秋田県" "06:山形県" "07:福島県" \
                "08:茨城県" "09:栃木県" "10:群馬県" "11:埼玉県" "12:千葉県" "13:東京都" "14:神奈川県" \
                "15:新潟県" "16:富山県" "17:石川県" "18:福井県" "19:山梨県" "20:長野県" "21:岐阜県" \
                "22:静岡県" "23:愛知県" "24:三重県" "25:滋賀県" "26:京都府" "27:大阪府" "28:兵庫県" \
                "29:奈良県" "30:和歌山県" "31:鳥取県" "32:島根県" "33:岡山県" "34:広島県" "35:山口県" \
                "36:徳島県" "37:香川県" "38:愛媛県" "39:高知県" "40:福岡県" "41:佐賀県" "42:長崎県" \
                "43:熊本県" "44:大分県" "45:宮崎県" "46:鹿児島県" "47:沖縄県"; do
                pref_code="${pref_spec%%:*}"
                pref_name="${pref_spec#*:}"
                settings_json="{\"lgCodes\":[\"^${pref_code}\"]}"
                export SETTINGS_JSON="$settings_json"
                prefix_out="/work-tmp/${pref_code}-machi-aza"
                rm -rf /work-tmp/merge-data-left-join-* "$prefix_out"
                mkdir -p "$prefix_out"
                echo "Generating $pref_name ($pref_code)"
                if npm run run:02_make_machi_aza -- "$prefix_out"; then
                  copy_prefecture_json "$prefix_out" "$pref_name"
                else
                  status="$?"
                  rm -rf /work-tmp/merge-data-left-join-* "$prefix_out"
                  echo "run:02_make_machi_aza failed for $pref_name" >&2
                  exit "$status"
                fi
                rm -rf /work-tmp/merge-data-left-join-* "$prefix_out"
                run_data_stage run:03_make_rsdt 住居表示 "$pref_code" "$pref_name"
                run_data_stage run:04_make_chiban 地番 "$pref_code" "$pref_name"
              done
              rm -rf /work-tmp/merge-data-left-join-*
              unset SETTINGS_JSON
              npm run run:10_refresh_csv_ranges -- "$final_out"
              npm run run:99_create_stats -- "$final_out"
            '
          canonical_updated="$(jq -r '.meta.updated' out/api/ja.json)"
          if ! [[ "$canonical_updated" =~ ^[0-9]+$ ]] || [ "$canonical_updated" -le 0 ]; then
            echo 'ja.json meta.updated is invalid' >&2
            exit 1
          fi
          city_files="$(mktemp)"
          if ! find out/api/ja -mindepth 2 -maxdepth 2 -type f -name '*.json' -print0 > "$city_files"; then
            echo 'failed to enumerate municipality JSON files' >&2
            exit 1
          fi
          while IFS= read -r -d '' city_file; do
            tmp_file="${city_file}.tmp"
            if ! jq --argjson updated "$canonical_updated" '.meta.updated = $updated' "$city_file" > "$tmp_file"; then
              rm -f "$tmp_file"
              echo "failed to normalize metadata: $city_file" >&2
              exit 1
            fi
            if ! mv -- "$tmp_file" "$city_file"; then
              echo "failed to replace metadata: $city_file" >&2
              exit 1
            fi
          done < "$city_files"
          rm -f "$city_files"
      - name: Validate generated dataset
        run: npm run dataset:validate -- upstream/out/api > dataset-summary.json
      - name: Derive source timestamp
        run: |
          updated="$(jq -r '.meta.updated' upstream/out/api/ja.json)"
          if ! [[ "$updated" =~ ^[0-9]+$ ]] || [ "$updated" -le 0 ]; then exit 1; fi
          echo "SOURCE_UPDATED_AT=$(date -u -d "@$updated" '+%Y-%m-%dT%H:%M:%S.000Z')" >> "$GITHUB_ENV"
      - name: Generate deterministic SHA-256 inventory
        run: |
          npm run inventory -- generate upstream/out inventory.json _integrity/sha256.json
          echo "INVENTORY_SHA256=$(sha256sum inventory.json | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          echo "INVENTORY_FILE_COUNT=$(jq -r '.fileCount' inventory.json)" >> "$GITHUB_ENV"
          echo "INVENTORY_TOTAL_BYTES=$(jq -r '.totalBytes' inventory.json)" >> "$GITHUB_ENV"
      - name: Read and validate current manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          aws s3 cp "s3://$R2_BUCKET/manifest.json" manifest.json --endpoint-url "$R2_ENDPOINT" --no-progress
          npm run manifest -- validate manifest.json
          if jq -e --arg version "$VERSION" '.versions | has($version)' manifest.json >/dev/null; then
            echo "Version is already registered and immutable" >&2
            exit 1
          fi
      - name: Prepare immutable build marker
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          jq -n --arg version "$VERSION" --arg upstreamCommit "$UPSTREAM_COMMIT" --arg sourceUpdatedAt "$SOURCE_UPDATED_AT" \
            --arg inventorySha256 "$INVENTORY_SHA256" --argjson fileCount "$INVENTORY_FILE_COUNT" --argjson totalBytes "$INVENTORY_TOTAL_BYTES" \
            '{version:$version,upstreamCommit:$upstreamCommit,sourceUpdatedAt:$sourceUpdatedAt,inventorySha256:$inventorySha256,fileCount:$fileCount,totalBytes:$totalBytes}' > build-metadata.json
          existing="$(aws s3api list-objects-v2 --bucket "$R2_BUCKET" --prefix "versions/$VERSION/" --max-items 1 --query 'Contents[0].Key' --output text --endpoint-url "$R2_ENDPOINT")"
          if [ "$existing" != 'None' ]; then
            aws s3 cp "s3://$R2_BUCKET/versions/$VERSION/_build.json" existing-build.json --endpoint-url "$R2_ENDPOINT" --no-progress
            jq -e --arg version "$VERSION" --arg upstreamCommit "$UPSTREAM_COMMIT" --arg sourceUpdatedAt "$SOURCE_UPDATED_AT" \
              --arg inventorySha256 "$INVENTORY_SHA256" --argjson fileCount "$INVENTORY_FILE_COUNT" --argjson totalBytes "$INVENTORY_TOTAL_BYTES" \
              '.version == $version and .upstreamCommit == $upstreamCommit and .sourceUpdatedAt == $sourceUpdatedAt and .inventorySha256 == $inventorySha256 and .fileCount == $fileCount and .totalBytes == $totalBytes' existing-build.json >/dev/null
          else
            aws s3 cp build-metadata.json "s3://$R2_BUCKET/versions/$VERSION/_build.json" --endpoint-url "$R2_ENDPOINT" --content-type application/json --cache-control no-store --no-progress
          fi
      - name: Upload immutable version prefix
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          aws s3 cp upstream/out/api "s3://$R2_BUCKET/versions/$VERSION/api/" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control 'public,max-age=31536000,immutable' \
            --no-progress
          aws s3 cp inventory.json "s3://$R2_BUCKET/versions/$VERSION/_integrity/sha256.json" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/json \
            --cache-control 'public,max-age=31536000,immutable' --no-progress
          aws s3api head-object --bucket "$R2_BUCKET" --key "versions/$VERSION/api/ja.json" --endpoint-url "$R2_ENDPOINT"
      - name: Download and verify the complete uploaded version
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          rm -rf upstream/out/api
          available_bytes="$(df -Pk "${RUNNER_TEMP:-.}" | awk 'NR==2 {print $4 * 1024}')"
          required_bytes=$((INVENTORY_TOTAL_BYTES + 1073741824))
          if ! [[ "$available_bytes" =~ ^[0-9]+$ ]] || [ "$available_bytes" -lt "$required_bytes" ]; then
            echo "insufficient temporary disk: require at least ${required_bytes} bytes" >&2
            exit 1
          fi
          verify_root="$(mktemp -d)"
          trap 'rm -rf "$verify_root"' EXIT
          mkdir -p "$verify_root/api" "$verify_root/_integrity"
          aws s3 cp "s3://$R2_BUCKET/versions/$VERSION/api/" "$verify_root/api/" --recursive --endpoint-url "$R2_ENDPOINT" --no-progress
          aws s3 cp "s3://$R2_BUCKET/versions/$VERSION/_integrity/sha256.json" "$verify_root/_integrity/sha256.json" --endpoint-url "$R2_ENDPOINT" --no-progress
          npm run inventory -- verify "$verify_root" "$verify_root/_integrity/sha256.json" _integrity/sha256.json
          echo 'INTEGRITY_VERIFIED=true' >> "$GITHUB_ENV"
      - name: Register version and optionally activate
        id: publish
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ '${{ inputs.activate }}' = 'true' ]; then
            switch_inventory="$(mktemp)"
            trap 'rm -f "$switch_inventory"' EXIT
            aws s3 cp "s3://$R2_BUCKET/versions/$VERSION/_integrity/sha256.json" "$switch_inventory" --endpoint-url "$R2_ENDPOINT" --no-progress
            test "$(sha256sum "$switch_inventory" | cut -d ' ' -f 1)" = "$INVENTORY_SHA256"
            test "$(jq -r '.fileCount' "$switch_inventory")" = "$INVENTORY_FILE_COUNT"
            test "$(jq -r '.totalBytes' "$switch_inventory")" = "$INVENTORY_TOTAL_BYTES"
            test "$INTEGRITY_VERIFIED" = true
          fi
          aws s3 cp "s3://$R2_BUCKET/manifest.json" manifest-before-register-check.json --endpoint-url "$R2_ENDPOINT" --no-progress
          if ! cmp --silent manifest.json manifest-before-register-check.json; then
            echo 'concurrent manifest update; refusing read-modify-write' >&2
            exit 1
          fi
          cp manifest.json manifest-before-switch.json
          npm run manifest -- register manifest.json "$VERSION" "versions/$VERSION" "$SOURCE_UPDATED_AT" --coverage national \
            --integrity-path _integrity/sha256.json --integrity-sha256 "$INVENTORY_SHA256" \
            --integrity-file-count "$INVENTORY_FILE_COUNT" --integrity-total-bytes "$INVENTORY_TOTAL_BYTES"
          if [ '${{ inputs.activate }}' = 'true' ]; then npm run manifest -- switch manifest.json "$VERSION"; fi
          npm run manifest -- validate manifest.json
          aws s3 cp manifest.json "s3://$R2_BUCKET/manifest.json" --endpoint-url "$R2_ENDPOINT" --content-type application/json --cache-control no-cache --no-progress
      - name: Verify published R2 manifest and root
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          aws s3 cp "s3://$R2_BUCKET/manifest.json" published-manifest.json --endpoint-url "$R2_ENDPOINT" --no-progress
          if [ '${{ inputs.activate }}' = 'true' ]; then jq -e --arg version "$VERSION" '.current == $version and (.versions[$version] != null)' published-manifest.json; else jq -e --arg version "$VERSION" '.versions[$version] != null' published-manifest.json; fi
          aws s3api head-object --bucket "$R2_BUCKET" --key "versions/$VERSION/api/ja.json" --endpoint-url "$R2_ENDPOINT"
          aws s3api head-object --bucket "$R2_BUCKET" --key "versions/$VERSION/_integrity/sha256.json" --endpoint-url "$R2_ENDPOINT"
      - name: Smoke test public gateway
        if: inputs.activate
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          npm run smoke -- "$PUBLIC_BASE_URL" "$VERSION"
      - name: Restore previous manifest after activation failure
        if: failure() && inputs.activate && steps.publish.outcome == 'success'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: aws s3 cp manifest-before-switch.json "s3://$R2_BUCKET/manifest.json" --endpoint-url "$R2_ENDPOINT" --content-type application/json --cache-control no-cache --no-progress
